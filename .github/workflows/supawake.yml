name: Supabase Keep Alive (Debug)

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug single instance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URLS }}   # 仅取第一行
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEYS }}   # 仅取第一行
        run: |
          # 提取第一行
          url=$(echo "$SUPABASE_URL" | head -n1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          key=$(echo "$SUPABASE_KEY" | head -n1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          echo "🔹 Testing URL: $url"
          echo "🔑 Key: $key"
          
          # 完整 curl 输出（含 -v）
          curl -v -X GET \
            "${url}/rest/v1/" \
            -H "Authorization: Bearer ${key}" \
            -H "apikey: ${key}" \
            --connect-timeout 10 \
            --retry 0
          
          # 如果失败，打印状态码
          if [ $? -ne 0 ]; then
            echo "❌ Curl failed, check above output"
            exit 1
          fi
