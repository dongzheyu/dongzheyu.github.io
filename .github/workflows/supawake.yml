name: Supabase Keep Alive (Multi-instance)

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  ping-all:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Supabase instances
        env:
          SUPABASE_URLS: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEYS: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 使用 IFS= 保留空行，用 readarray 逐行读取，同时用 tr 删除 \r
          IFS=$'\n' readarray -t raw_urls < <(echo "$SUPABASE_URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          IFS=$'\n' readarray -t raw_keys < <(echo "$SUPABASE_KEYS" | tr -d '\r' | sed '/^[[:space:]]*$/d')

          # 去除每行首尾空格（sed 处理）
          urls=()
          for u in "${raw_urls[@]}"; do
            u_clean=$(echo "$u" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            urls+=("$u_clean")
          done

          keys=()
          for k in "${raw_keys[@]}"; do
            k_clean=$(echo "$k" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            keys+=("$k_clean")
          done

          # 检查数量匹配
          if [ ${#urls[@]} -ne ${#keys[@]} ]; then
            echo "❌ Error: URLs count (${#urls[@]}) != Keys count (${#keys[@]})"
            exit 1
          fi

          # 循环处理每个实例
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            key="${keys[$i]}"
            echo "🔹 Pinging instance $((i+1)): ${url}"

            # 脱敏打印 Key 的前8位，方便核对
            key_preview="${key:0:8}..."
            echo "   Key preview: ${key_preview}"

            # 执行 curl，如果失败会非0退出
            curl -I \
              "${url}/rest/v1/" \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              --fail \
              --connect-timeout 10 \
              --retry 2 \
              --output /dev/null \
              --write-out "   HTTP Status: %{http_code}\n"

            if [ $? -eq 0 ]; then
              echo "   ✅ Instance $((i+1)) keep-alive successful"
            else
              echo "   ❌ Instance $((i+1)) failed"
              exit 1
            fi
            echo ""
          done

          echo "✅ All Supabase instances pinged successfully"