name: Supabase Keep Alive (Multi-instance)

on:
  schedule:
    - cron: '30 23 * * *'   # 每天 UTC 23:30（北京时间次日 07:30）
  workflow_dispatch:        # 允许手动触发

jobs:
  ping-all:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Supabase instances
        env:
          SUPABASE_URLS: ${{ secrets.SUPABASE_URLS }}
          SUPABASE_KEYS: ${{ secrets.SUPABASE_KEYS }}   # 这里存放 publishable keys
        run: |
          # 清理输入：去除 \r 和空行，并去除首尾空格
          mapfile -t raw_urls < <(echo "$SUPABASE_URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          mapfile -t raw_keys < <(echo "$SUPABASE_KEYS" | tr -d '\r' | sed '/^[[:space:]]*$/d')

          # 二次 trim
          urls=()
          for u in "${raw_urls[@]}"; do
            u_clean=$(echo "$u" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            urls+=("$u_clean")
          done

          keys=()
          for k in "${raw_keys[@]}"; do
            k_clean=$(echo "$k" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            keys+=("$k_clean")
          done

          # 检查数量是否一致
          if [ ${#urls[@]} -ne ${#keys[@]} ]; then
            echo "❌ Error: URLs count (${#urls[@]}) does not match Keys count (${#keys[@]})"
            exit 1
          fi

          # 循环调用
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            key="${keys[$i]}"
            echo "🔹 Pinging instance $((i+1)): ${url}"
            # 仅显示 key 的前 8 位用于核对（安全）
            echo "   Key preview: ${key:0:8}..."

            # 发送 HEAD 请求（--fail 使非 2xx 状态码导致脚本失败）
            curl -I \
              "${url}/rest/v1/" \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              --fail \
              --connect-timeout 10 \
              --retry 2 \
              --output /dev/null \
              --write-out "   HTTP Status: %{http_code}\n"

            if [ $? -eq 0 ]; then
              echo "   ✅ Instance $((i+1)) keep-alive successful"
            else
              echo "   ❌ Instance $((i+1)) failed"
              exit 1
            fi
            echo ""
          done

          echo "✅ All Supabase instances pinged successfully"