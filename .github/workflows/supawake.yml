name: Supabase Keep Alive (Debug)

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check keys
        env:
          SUPABASE_URLS: ${{ secrets.SUPABASE_URLS }}
          SUPABASE_KEYS: ${{ secrets.SUPABASE_KEYS }}
        run: |
          mapfile -t raw_urls < <(echo "$SUPABASE_URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          mapfile -t raw_keys < <(echo "$SUPABASE_KEYS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          urls=(); for u in "${raw_urls[@]}"; do u_clean=$(echo "$u" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'); urls+=("$u_clean"); done
          keys=(); for k in "${raw_keys[@]}"; do k_clean=$(echo "$k" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'); keys+=("$k_clean"); done
          if [ ${#urls[@]} -ne ${#keys[@]} ]; then echo "❌ Count mismatch"; exit 1; fi
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"; key="${keys[$i]}"
            echo "🔹 Instance $((i+1))"
            echo "   Key length: ${#key}"
            echo "   Key prefix: ${key:0:10}..."
            # 可选：打印密钥末尾几个字符，帮助确认是否完整
            echo "   Key suffix: ...${key: -6}"
            curl -I "${url}/rest/v1/" -H "Authorization: Bearer ${key}" --fail --connect-timeout 10 --retry 2 --output /dev/null --write-out "HTTP %{http_code}\n" || { echo "❌ Failed"; exit 1; }
          done
          echo "✅ All done"
